name: Sandbox CI

# Serveur d'essai FastAPI. Il n'est ni publié ni déployé : seuls ses tests tournent.
on:
  push:
    branches: [main]
    paths: ["sandbox/fastapi-auth/**", ".github/workflows/sandbox-ci.yml"]
  pull_request:
    paths: ["sandbox/fastapi-auth/**", ".github/workflows/sandbox-ci.yml"]

concurrency:
  group: sandbox-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: sandbox/fastapi-auth

jobs:
  check:
    name: Lint, migrations et tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-secret-ci-secret-ci-secret-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sandbox/fastapi-auth/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - name: Migrations
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
        run: |
          alembic upgrade head
          alembic check
      - run: pytest
